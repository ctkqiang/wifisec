<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 朱砂印泥红：中式印章主色 -->
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5575F"/>
      <stop offset="1" stop-color="#C62F39"/>
    </linearGradient>
    <!-- 鎏金：乾坤圈与火尖 -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9CD48"/>
      <stop offset="1" stop-color="#F0922B"/>
    </linearGradient>
  </defs>

  <!-- 印章底：圆角方章 -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#seal)"/>
  <!-- 内缘细金线：仿双缘印章的工整感 -->
  <rect x="15.5" y="15.5" width="89" height="89" rx="18.5"
        fill="none" stroke="#F9CD48" stroke-opacity="0.45" stroke-width="1.6"/>

  <!-- 顶部火尖：哪吒火尖枪意象，点出「攻防之刃」 -->
  <path d="M60 20 L66.5 31 Q60 28.4 53.5 31 Z" fill="url(#gold)"/>

  <!-- 乾坤圈：护网之环，环住下方电波 -->
  <circle cx="60" cy="66" r="32" fill="none" stroke="url(#gold)"
          stroke-width="4.2" opacity="0.95"/>

  <!-- WiFi 电波：两道弧 + 印心圆点，如踏风火轮发波 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M44 70 A 22 22 0 0 1 76 70" stroke-width="5.6"/>
    <path d="M52 78 A 11.5 11.5 0 0 1 68 78" stroke-width="5.6"/>
  </g>
  <circle cx="60" cy="87" r="5.2" fill="#FFFFFF"/>
</svg>
