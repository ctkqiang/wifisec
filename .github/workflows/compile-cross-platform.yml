# =============================================================================
# wifisec 跨平台编译工作流
# 支持 macOS、Ubuntu、Windows 三平台自动执行 make build 并归档产物
#
# 说明：
#   - macOS  上 make build 会产出 .app bundle（ad-hoc 签名，定位授权依赖此签名）
#   - Windows 上通过 Chocolatey 安装 make，在 Git Bash 中执行
#   - 产物以 artifact 形式保留 30 天，可在 Actions 页面下载
# =============================================================================

name: 跨平台编译

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # macOS 编译
  # ===========================================================================
  compile-macos:
    name: 编译 - macOS
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 (make build)
        run: make build

      - name: 验证构建产物
        run: |
          echo "::group::构建产物检查"
          ls -la build/
          file build/wifisec.app/Contents/MacOS/wifisec
          codesign -dv build/wifisec.app 2>&1 || true
          echo "::endgroup::"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wifisec-macos
          path: |
            build/wifisec.app/**
          retention-days: 30

  # ===========================================================================
  # Ubuntu 编译
  # ===========================================================================
  compile-ubuntu:
    name: 编译 - Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 (make build)
        run: make build

      - name: 验证构建产物
        run: |
          echo "::group::构建产物检查"
          ls -la build/
          file build/wifisec
          ldd build/wifisec || true
          echo "::endgroup::"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wifisec-ubuntu
          path: |
            build/wifisec
          retention-days: 30

  # ===========================================================================
  # Windows 编译
  # ===========================================================================
  compile-windows:
    name: 编译 - Windows
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash：Makefile 依赖 uname/rm/mkdir 等 Unix 工具
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 make
        run: choco install make -y --no-progress

      - name: 编译 (make build)
        run: make build

      - name: 重命名产物为 .exe
        run: mv build/wifisec build/wifisec.exe

      - name: 验证构建产物
        run: |
          echo "::group::构建产物检查"
          ls -la build/
          file build/wifisec.exe
          echo "::endgroup::"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wifisec-windows
          path: |
            build/wifisec.exe
          retention-days: 30

  # ===========================================================================
  # 构建状态汇总
  # ===========================================================================
  build-summary:
    name: 构建汇总
    runs-on: ubuntu-latest
    needs: [compile-macos, compile-ubuntu, compile-windows]
    if: always()

    steps:
      - name: 检查构建结果
        run: |
          echo "========================================="
          echo "  wifisec 跨平台构建结果"
          echo "========================================="
          echo ""
          echo "  macOS:   ${{ needs.compile-macos.result }}"
          echo "  Ubuntu:  ${{ needs.compile-ubuntu.result }}"
          echo "  Windows: ${{ needs.compile-windows.result }}"
          echo ""
          echo "========================================="

          if [ "${{ needs.compile-macos.result }}" = "failure" ] || \
             [ "${{ needs.compile-ubuntu.result }}" = "failure" ] || \
             [ "${{ needs.compile-windows.result }}" = "failure" ]; then
            echo "::error::一个或多个平台编译失败"
            exit 1
          fi

          echo "所有平台编译成功"

  # ===========================================================================
  # Release：tag 推送时打包三平台产物 + 生成中文 PDF 文档，创建 GitHub Release
  # 仅在 tag（v*）推送时运行；普通分支推送只编译不发版
  # ===========================================================================
  release:
    name: 发布 - GitHub Release
    runs-on: ubuntu-latest
    needs: [compile-macos, compile-ubuntu, compile-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载三平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 产物命名对齐 wifisec-{os}；macOS 附带 .app bundle（定位授权依赖）
      - name: 整理发布产物
        run: |
          mkdir -p release

          cp artifacts/wifisec-ubuntu/wifisec release/wifisec-linux-amd64
          cp artifacts/wifisec-windows/wifisec.exe release/wifisec-windows-amd64.exe

          # upload-artifact 上传的是 wifisec.app/**（目录内容），下载后需重建目录结构
          mkdir -p wifisec.app
          cp -r artifacts/wifisec-macos/ wifisec.app/
          zip -r release/wifisec-macos-app.zip wifisec.app

          ls -la release/

      # 中文 PDF 用系统 Noto CJK 字体渲染；stylesheet 管正文，cjk 管字体回退
      - name: 安装 pandoc 与中日韩字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc fonts-noto-cjk

      - name: 生成 PDF 文档
        run: |
          pandoc \
            docs/feature/wifi_list.md \
            docs/feature/wifi_serial.md \
            docs/feature/wifi_deauth.md \
            -o release/wifisec-docs.pdf \
            --pdf-engine=xelatex \
            -V mainfont="Noto Sans CJK SC" \
            -V monofont="Noto Sans Mono CJK SC" \
            -V geometry:margin=2.2cm \
            -V CJKmainfont="Noto Sans CJK SC" \
            --toc \
            --toc-depth=3 \
            -V linkcolor=cyan \
            --metadata title="WifiSec 使用文档" \
            --metadata author="钟智强 · 哪吒网络安全" \
            --metadata date="$(date +%Y-%m-%d)"

          ls -la release/wifisec-docs.pdf

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS | `wifisec-macos-app.zip` | 解压后得 `wifisec.app`，定位授权依赖 bundle |
            | Linux | `wifisec-linux-amd64` | 单文件二进制，`chmod +x` 后运行 |
            | Windows | `wifisec-windows-amd64.exe` | 单文件可执行 |

            另有 `wifisec-docs.pdf`：全部命令、串口协议、烧录排错合并的中文 PDF 手册。

            > 仅限自有或已获书面授权的网络使用。
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
